name: Build flipChartTests

on:
  workflow_dispatch:
  push:

jobs:
  # DPI-5056 snapshot push test (do not merge): calls nixr-public's dev branch, which has the snapshot-diff changes,
  # with NixR's DPI-5056-snapshot-artifacts branch, and grants the permissions the snapshot push needs.
  build:
    name: Build flipChartTests
    permissions:
      checks: write
      contents: write
      pull-requests: write
    uses: Displayr/nixr-public/.github/workflows/build-flake-installable.yaml@dev
    with:
      installable-path: pkgs.x86_64-linux.rPackages.flipChartTests
      build-args: --override-input flipChartTests .
      installable-name: flipChartTests
      nixr-ref: DPI-5056-snapshot-artifacts
    secrets: inherit
